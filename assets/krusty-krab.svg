<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430">
  <defs>
    <pattern id="lattice" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="22" height="22" fill="#5cb6ea"/>
      <rect x="0" y="0" width="5" height="22" fill="#2a6fa8"/>
      <rect x="0" y="0" width="22" height="5" fill="#2a6fa8"/>
    </pattern>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9763a"/>
      <stop offset="1" stop-color="#8d5427"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g stroke="#2a1a10" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- shadow -->
    <ellipse cx="310" cy="400" rx="280" ry="18" fill="#000" opacity=".15" stroke="none"/>
    <!-- base -->
    <path d="M50 345 L570 345 L585 395 L35 395 Z" fill="#6e4120"/>
    <path d="M70 360 h480 M60 378 h500" stroke="#4a2a12" stroke-width="3" fill="none"/>
    <!-- body -->
    <path d="M85 350 L85 175 Q85 105 160 98 L460 98 Q535 105 535 175 L535 350 Z" fill="url(#wood)"/>
    <!-- planks -->
    <g stroke="#5e3517" stroke-width="3" fill="none">
      <path d="M88 150 Q310 135 532 150"/>
      <path d="M86 205 H534"/>
      <path d="M86 262 H534"/>
      <path d="M86 315 H534"/>
    </g>
    <g stroke="#d99a5c" stroke-width="2.5" fill="none" opacity=".8">
      <path d="M110 125 q40 -6 80 0 M260 116 q50 -4 100 0 M420 122 q40 -4 80 2"/>
      <path d="M100 232 h60 M380 290 h70 M460 232 h50 M120 335 h40"/>
    </g>
    <!-- corner posts -->
    <path d="M70 350 V170 Q70 95 150 86 L175 86 L175 104 L155 106 Q100 114 100 175 V350 Z" fill="#9b5f2c"/>
    <path d="M550 350 V170 Q550 95 470 86 L445 86 L445 104 L465 106 Q520 114 520 175 V350 Z" fill="#9b5f2c"/>
    <!-- center beam -->
    <rect x="290" y="80" width="40" height="270" fill="#a6672f"/>
    <!-- windows -->
    <rect x="118" y="160" width="150" height="150" rx="6" fill="url(#lattice)"/>
    <rect x="352" y="160" width="150" height="150" rx="6" fill="url(#lattice)"/>
    <rect x="118" y="160" width="150" height="150" rx="6" fill="url(#glass)" stroke="none"/>
    <rect x="352" y="160" width="150" height="150" rx="6" fill="url(#glass)" stroke="none"/>
    <rect x="110" y="152" width="166" height="166" rx="8" fill="none" stroke-width="9" stroke="#5a3214"/>
    <rect x="344" y="152" width="166" height="166" rx="8" fill="none" stroke-width="9" stroke="#5a3214"/>
    <!-- doors -->
    <rect x="262" y="198" width="96" height="152" fill="#1f5f9e"/>
    <rect x="268" y="204" width="40" height="146" fill="#3a8ad6"/>
    <rect x="312" y="204" width="40" height="146" fill="#3a8ad6"/>
    <rect x="276" y="216" width="24" height="64" rx="4" fill="#a6dcff"/>
    <rect x="320" y="216" width="24" height="64" rx="4" fill="#a6dcff"/>
    <circle cx="303" cy="300" r="4" fill="#ffd34d"/>
    <circle cx="317" cy="300" r="4" fill="#ffd34d"/>
    <!-- flag string -->
    <path d="M100 118 Q310 160 520 118" fill="none" stroke-width="2.5"/>
    <g stroke-width="2.5">
      <path d="M128 124 l18 3 l-6 24 z" fill="#e8402f"/>
      <path d="M170 132 l20 3 l-8 24 z" fill="#ffd23f"/>
      <path d="M214 138 l20 2 l-9 24 z" fill="#3fa0e0"/>
      <path d="M258 141 l20 1 l-9 25 z" fill="#5cc45c"/>
      <path d="M342 141 l20 -1 l-10 25 z" fill="#e8402f"/>
      <path d="M386 138 l20 -2 l-10 24 z" fill="#ffd23f"/>
      <path d="M430 132 l20 -3 l-10 24 z" fill="#3fa0e0"/>
      <path d="M472 124 l18 -3 l-6 24 z" fill="#5cc45c"/>
    </g>
    <!-- roof sign -->
    <path d="M150 70 Q310 18 470 70 L460 96 Q310 48 160 96 Z" fill="#c9853f"/>
    <path id="arc" d="M175 84 Q310 40 445 84" fill="none" stroke="none"/>
    <text font-family="'Arial Black', Impact, sans-serif" font-size="30" fill="#e8402f" stroke="#2a1a10" stroke-width="1.5" letter-spacing="3">
      <textPath href="#arc" startOffset="50%" text-anchor="middle">KRUSTY KRAB</textPath>
    </text>
    <!-- anchor rope -->
    <path d="M60 345 q-20 -40 0 -80" fill="none" stroke="#e8d3a3" stroke-width="6"/>
    <!-- barrel -->
    <g transform="translate(540 300)">
      <path d="M0 0 h48 q8 25 0 50 h-48 q-8 -25 0 -50 z" fill="#8a5426"/>
      <path d="M-3 14 h54 M-3 36 h54" stroke-width="4" fill="none" stroke="#3b3b3b"/>
    </g>
  </g>
</svg>
