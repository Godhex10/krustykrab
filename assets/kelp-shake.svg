<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 400">
  <defs>
    <linearGradient id="kg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cc743"/>
      <stop offset=".35" stop-color="#b9f27a"/>
      <stop offset="1" stop-color="#5aa62c"/>
    </linearGradient>
  </defs>
  <g stroke="#1e3410" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- straw -->
    <path d="M118 70 L130 20 L180 4" fill="none" stroke-width="15"/>
    <path d="M118 70 L130 20 L180 4" fill="none" stroke="#ffe24a" stroke-width="7"/>
    <!-- lid -->
    <rect x="72" y="60" width="76" height="22" rx="6" fill="#d8f4b0"/>
    <!-- bottle: two bulbs -->
    <path d="M80 82 L140 82 L142 98 C200 110 205 190 150 205 C205 222 205 330 150 362 L70 362 C15 330 15 222 70 205 C15 190 20 110 78 98 Z" fill="url(#kg)"/>
    <!-- highlights -->
    <path d="M52 130 Q46 160 60 182" fill="none" stroke="#e6ffc8" stroke-width="8" opacity=".9"/>
    <path d="M44 250 Q38 290 54 330" fill="none" stroke="#e6ffc8" stroke-width="8" opacity=".9"/>
    <!-- bubbles inside -->
    <g fill="none" stroke="#e6ffc8" stroke-width="2.5" opacity=".85">
      <circle cx="150" cy="140" r="6"/><circle cx="130" cy="170" r="4"/><circle cx="150" cy="300" r="7"/><circle cx="160" cy="270" r="4"/>
    </g>
    <!-- label -->
    <path d="M28 222 L192 222 L196 280 L24 280 Z" fill="#ffd93b"/>
    <text x="110" y="248" font-family="'Arial Black', Impact, sans-serif" font-size="24" text-anchor="middle" fill="#7a5a00" stroke="#3a2a00" stroke-width="1.2">KELP</text>
    <text x="110" y="274" font-family="'Arial Black', Impact, sans-serif" font-size="24" text-anchor="middle" fill="#7a5a00" stroke="#3a2a00" stroke-width="1.2">SHAKE</text>
  </g>
</svg>
